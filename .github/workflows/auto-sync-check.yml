name: Auto Sync Check (Fallback)

on:
  schedule:
    # 毎日 JST 1:00 (UTC 16:00) に実行（保険として）
    - cron: '0 16 * * *'
  workflow_dispatch:

# 並行実行制御：archive更新系workflowで統一
concurrency:
  group: archive-nankan-update
  cancel-in-progress: false

jobs:
  auto-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # private 化後の keiba-data-shared を cross-repo read するため、本 job の全 step へ供給。
    # verify:sync(verifyArchiveSync.js) / import:results(importResults.js) が認証取得に使用。
    # "Detect missing dates" 内の匿名 curl は認証付き Node（checkSharedDailyFile.mjs で unified 確認 →
    # 正規404時のみ checkSharedNankanResults.mjs で per-venue 合算）へ移行済み（PR-AK-4・旧契約を厳密再現）。
    env:
      KEIBA_DATA_SHARED_TOKEN: ${{ secrets.KEIBA_DATA_SHARED_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'astro-site/package-lock.json'

      - name: Install dependencies
        working-directory: astro-site
        run: npm ci

      - name: Check sync status
        id: check-sync
        working-directory: astro-site
        continue-on-error: true
        run: |
          echo "🔍 Checking sync status..."
          npm run verify:sync

      - name: Detect missing dates
        id: detect-missing
        if: steps.check-sync.outcome == 'failure'
        working-directory: astro-site
        run: |
          echo "🔍 Detecting missing dates..."

          # token 未設定は取得前に fail-fast（値は出力しない）
          if [ -z "${KEIBA_DATA_SHARED_TOKEN:-}" ]; then
            echo "❌ KEIBA_DATA_SHARED_TOKEN is not configured"
            exit 1
          fi

          # 過去7日分の日付をチェック
          MISSING_DATES=""
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)

          for i in {1..7}; do
            CHECK_DATE=$(TZ=Asia/Tokyo date -d "$TODAY - $i days" +%Y-%m-%d 2>/dev/null || date -v-${i}d +%Y-%m-%d)

            # 旧契約の厳密再現（匿名 curl/raw 廃止・認証付き）:
            #   FOUND = unified nankan/results/Y/M/DATE.json が存在（race数不問）
            #           OR unified が正規404 のとき per-venue OOI/FUN/KAW/URA の race 合計 ≥ 12
            # fatal（token不足/401/403/429/5xx/timeout/malformed/INVALID_*）は確認 script が exit 1
            # → step 失敗。fallback へ進むのは unified が「正規404=FOUND=false」のときだけ。
            FOUND=false

            # (1) unified を認証付きで確認（旧: HTTP200 なら race数不問で FOUND）
            UNIFIED_OUT=$(node scripts/checkSharedDailyFile.mjs --category nankan --kind results --date "$CHECK_DATE") || {
              echo "❌ Failed to confirm Nankan unified results for $CHECK_DATE (auth/network error)."
              exit 1
            }
            UNIFIED_FOUND=$(printf '%s\n' "$UNIFIED_OUT" | sed -n 's/^FOUND=//p')

            if [ "$UNIFIED_FOUND" = "true" ]; then
              FOUND=true
            else
              # (2) unified が正規404 のときだけ per-venue 合算へ fallback（旧契約どおり）
              CHECK_OUT=$(node scripts/checkSharedNankanResults.mjs --date "$CHECK_DATE" --venues OOI,FUN,KAW,URA) || {
                echo "❌ Failed to confirm Nankan per-venue results for $CHECK_DATE (auth/network error)."
                exit 1
              }
              TOTAL_RACES=$(printf '%s\n' "$CHECK_OUT" | sed -n 's/^TOTAL_RACES=//p')
              TOTAL_RACES="${TOTAL_RACES:-0}"
              if [ "$TOTAL_RACES" -ge 12 ]; then
                FOUND=true
              fi
            fi

            if [ "$FOUND" = true ]; then
              # archiveResults.json に存在するか確認
              if ! jq -e --arg date "$CHECK_DATE" '.[] | select(.date == $date)' src/data/archiveResults.json > /dev/null; then
                echo "❌ Missing: $CHECK_DATE"
                if [ -z "$MISSING_DATES" ]; then
                  MISSING_DATES="$CHECK_DATE"
                else
                  MISSING_DATES="$MISSING_DATES,$CHECK_DATE"
                fi
              fi
            fi
          done

          if [ -n "$MISSING_DATES" ]; then
            echo "missing_dates=$MISSING_DATES" >> $GITHUB_OUTPUT
            echo "has_missing=true" >> $GITHUB_OUTPUT
            echo "🔴 Missing dates detected: $MISSING_DATES"
          else
            echo "has_missing=false" >> $GITHUB_OUTPUT
            echo "✅ No missing dates"
          fi

      - name: Auto-import missing dates
        if: steps.detect-missing.outputs.has_missing == 'true'
        working-directory: astro-site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MISSING_DATES="${{ steps.detect-missing.outputs.missing_dates }}"
          IFS=',' read -ra DATES <<< "$MISSING_DATES"

          for DATE in "${DATES[@]}"; do
            echo "━━━ Auto-importing: $DATE ━━━"
            npm run import:results -- --date "$DATE"
          done

      - name: Validate and verify
        if: steps.detect-missing.outputs.has_missing == 'true'
        working-directory: astro-site
        run: |
          echo "🔍 Validating archive format..."
          npm run validate:archive

          echo "🔍 Verifying archive sync..."
          npm run verify:sync

      - name: Commit and push
        if: steps.detect-missing.outputs.has_missing == 'true'
        working-directory: astro-site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add src/data/archiveResults.json

          if git diff --staged --quiet; then
            echo "⏭️  No changes to commit"
            exit 0
          fi

          MISSING_DATES="${{ steps.detect-missing.outputs.missing_dates }}"

          git commit -m "$(cat <<'EOF'
          🔧 Auto-sync fallback: ${MISSING_DATES}

          【自動修復】
          sync check で不足日を検出し、自動インポートを実行しました。

          🤖 Generated with [Claude Code](https://claude.com/claude-code)

          Co-Authored-By: Claude <noreply@anthropic.com>
          EOF
          )"

          git push

      - name: Success notification
        if: steps.detect-missing.outputs.has_missing == 'true'
        run: |
          echo "✅ Auto-sync fallback completed"
          echo "   Missing dates: ${{ steps.detect-missing.outputs.missing_dates }}"
          echo "   Successfully imported and pushed to main"

      - name: Already synced notification
        if: steps.check-sync.outcome == 'success'
        run: |
          echo "✅ Archive already in sync"
          echo "   No action needed"
