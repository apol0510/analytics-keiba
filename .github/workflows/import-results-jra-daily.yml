name: Import JRA Results Daily Check

on:
  schedule:
    # 毎日 23:30 JST (14:30 UTC) に実行
    - cron: '30 14 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [jra-results-updated]

# 並行実行制御：archiveResultsJra.json更新系workflowで統一（同じファイルへの同時コミット防止）
concurrency:
  group: archive-jra-update
  cancel-in-progress: false

jobs:
  check-and-import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: astro-site

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'astro-site/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Get current date (JST)
        id: date
        env:
          PAYLOAD_DATE: ${{ github.event.client_payload.date }}
        run: |
          # repository_dispatchで日付が指定されている場合はそれを使用
          if [ -n "$PAYLOAD_DATE" ] && [ "$PAYLOAD_DATE" != "null" ]; then
            DATE="$PAYLOAD_DATE"
            echo "📅 Using date from repository_dispatch: $DATE"
          else
            DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
            echo "📅 Current date (JST): $DATE"
          fi
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Check for missing results
        id: check
        env:
          # private 化後の keiba-data-shared を cross-repo read するための token。
          # secrets.GITHUB_TOKEN（自repoスコープ）は private 別repo読取に使わない。
          KEIBA_DATA_SHARED_TOKEN: ${{ secrets.KEIBA_DATA_SHARED_TOKEN }}
        run: |
          # token 未設定は取得前に fail-fast（値は出力しない）
          if [ -z "${KEIBA_DATA_SHARED_TOKEN:-}" ]; then
            echo "❌ KEIBA_DATA_SHARED_TOKEN is not configured"
            exit 1
          fi

          DATE="${{ steps.date.outputs.date }}"

          # keiba-data-shared の JRA results を「認証付き」で確認する。
          #
          # 2026-08-09: checkSharedDailyFile.mjs（統合 daily ファイル前提）から
          # checkJraResultsForImport.mjs（shared の per-venue 正本を直接読む）へ差し替えた。
          # 旧実装は jra/results/YYYY/MM/YYYY-MM-DD.json を見ていたが JRA results の正本は
          # per-venue（...-CHU.json）で統合ファイルは存在しないため FOUND は常に false になり、
          # 実開催日でも has_missing=false → 取込が一度も起動しなかった。
          #
          # exit 0 … 判定できた（FOUND の真偽を問わない）
          # exit 2 … 一時エラー（rate limit/timeout/5xx）で確定不能＝deferred。
          #          取込は見送るが run は落とさない（次回 schedule で再判定される）
          # exit 1 … token / 認証 / 権限 / schema 不一致＝fail-closed（results 無しと誤判定しない）
          echo "🔍 Checking for JRA results: $DATE"
          if CHECK_OUT=$(node scripts/checkJraResultsForImport.mjs --date "$DATE"); then
            CHECK_RC=0
          else
            CHECK_RC=$?
          fi

          if [ "$CHECK_RC" -eq 1 ]; then
            echo "❌ Failed to confirm JRA results availability (token/auth/permission/schema). Not treating as 'no results'."
            exit 1
          fi

          echo "$CHECK_OUT"

          if [ "$CHECK_RC" -eq 2 ]; then
            echo "⚠️  一時エラーのため取込判定を見送る（次回 schedule で再判定）"
            echo "has_missing=false" >> $GITHUB_OUTPUT
            echo "has_missing_sanrenpuku=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          FOUND=$(printf '%s\n' "$CHECK_OUT" | sed -n 's/^FOUND=//p')
          EXPECTED_VENUES=$(printf '%s\n' "$CHECK_OUT" | sed -n 's/^EXPECTED_VENUES=//p')
          EXPECTED_VENUES="${EXPECTED_VENUES:-0}"
          RESULT_STATE=$(printf '%s\n' "$CHECK_OUT" | sed -n 's/^STATE=//p')
          UNKNOWN_CODES=$(printf '%s\n' "$CHECK_OUT" | sed -n 's/^UNKNOWN_VENUE_CODES=//p')
          if [ -n "$UNKNOWN_CODES" ]; then
            echo "⚠️  未知の会場コードを検出 → ${UNKNOWN_CODES}"
          fi

          if [ "$FOUND" = "true" ]; then
            echo "✅ Results found in keiba-data-shared (state=$RESULT_STATE)"
            echo "   Expected venues: $EXPECTED_VENUES"

            # アーカイブに既に存在するかチェック
            if grep -q "\"date\": \"$DATE\"" src/data/archiveResultsJra.json; then
              # アーカイブの会場数を取得
              ARCHIVED_VENUES=$(node -e "const data = JSON.parse(require('fs').readFileSync('src/data/archiveResultsJra.json', 'utf8')); const entry = data.find(e => e.date === '$DATE'); console.log(entry ? entry.venues.length : 0);")
              echo "   Archived venues: $ARCHIVED_VENUES"

              # 会場数が一致するかチェック
              if [ "$ARCHIVED_VENUES" -ge "$EXPECTED_VENUES" ]; then
                echo "⏭️  Already processed with all venues: $DATE"
                echo "has_missing=false" >> $GITHUB_OUTPUT
              else
                echo "📥 Missing venues detected (archived: $ARCHIVED_VENUES, expected: $EXPECTED_VENUES)"
                echo "   Reimporting to include all venues"
                echo "has_missing=true" >> $GITHUB_OUTPUT
              fi
            else
              echo "📥 Missing from archive: $DATE"
              echo "has_missing=true" >> $GITHUB_OUTPUT
            fi

            # 三連複アーカイブにこの日のエントリがあるかを馬単と独立にチェック。
            # archiveSanrenpukuResultsJra.json は { "YYYY": { "MM": { "DD": {...} } } } 構造。
            # 馬単は取込済みでも三連複だけ欠落している日を確実に取り込む（南関 daily と同方針）。
            YEAR="${DATE%%-*}"; MONTH=$(echo "$DATE" | cut -d- -f2); DAY=$(echo "$DATE" | cut -d- -f3)
            if jq -e --arg y "$YEAR" --arg m "$MONTH" --arg d "$DAY" \
                 '.[$y][$m][$d]' src/data/archiveSanrenpukuResultsJra.json > /dev/null 2>&1; then
              echo "⏭️  Sanrenpuku already processed: $DATE"
              echo "has_missing_sanrenpuku=false" >> $GITHUB_OUTPUT
            else
              echo "📥 Missing sanrenpuku archive: $DATE"
              echo "has_missing_sanrenpuku=true" >> $GITHUB_OUTPUT
            fi
          else
            if [ "$RESULT_STATE" = "not_posted" ]; then
              echo "⏭️  computer 予想はあるが results 未投入（当日未完了の可能性）: $DATE"
            else
              echo "⏭️  results も computer 予想も無い＝非開催: $DATE"
            fi
            echo "has_missing=false" >> $GITHUB_OUTPUT
            echo "has_missing_sanrenpuku=false" >> $GITHUB_OUTPUT
          fi

      - name: Import missing results
        if: steps.check.outputs.has_missing == 'true'
        env:
          # private 化後の cross-repo read 用。importResultsJra.js が認証取得に使用。
          # "Check for missing results" は checkJraResultsForImport.mjs（認証付き・per-venue）で判定する。
          KEIBA_DATA_SHARED_TOKEN: ${{ secrets.KEIBA_DATA_SHARED_TOKEN }}
        run: |
          DATE="${{ steps.date.outputs.date }}"
          echo "📥 Importing JRA results for: $DATE"
          # exit 75 (EX_TEMPFAIL) = rate limit / timeout / 5xx で今は確定できない＝deferred。
          # 未書込なので途中状態は残らない。run を failure にせず次回の自動実行へ委ねる。
          # exit 1 等（auth / 権限 / schema / 検証失敗）は従来どおり失敗させる。
          if node scripts/importResultsJra.js --date "$DATE"; then
            RC_importResultsJra=0
          else
            RC_importResultsJra=$?
          fi
          if [ "$RC_importResultsJra" -eq 75 ]; then
            echo "⏸️  importResultsJra: 一時的に shared を取得できず未完了（deferred）。次回実行で再試行。"
          elif [ "$RC_importResultsJra" -ne 0 ]; then
            exit "$RC_importResultsJra"
          fi

      - name: Import JRA sanrenpuku results
        if: steps.check.outputs.has_missing_sanrenpuku == 'true'
        env:
          # 馬単と同一の結果ソース（jra/results）から三連複買い目の的中を集計。
          KEIBA_DATA_SHARED_TOKEN: ${{ secrets.KEIBA_DATA_SHARED_TOKEN }}
        run: |
          DATE="${{ steps.date.outputs.date }}"
          echo "📥 Importing JRA sanrenpuku results for: $DATE"
          # exit 75 (EX_TEMPFAIL) = rate limit / timeout / 5xx で今は確定できない＝deferred。
          # 未書込なので途中状態は残らない。run を failure にせず次回の自動実行へ委ねる。
          # exit 1 等（auth / 権限 / schema / 検証失敗）は従来どおり失敗させる。
          if node scripts/importResultsJraSanrenpuku.js --date "$DATE"; then
            RC_importResultsJraSanrenpuku=0
          else
            RC_importResultsJraSanrenpuku=$?
          fi
          if [ "$RC_importResultsJraSanrenpuku" -eq 75 ]; then
            echo "⏸️  importResultsJraSanrenpuku: 一時的に shared を取得できず未完了（deferred）。次回実行で再試行。"
          elif [ "$RC_importResultsJraSanrenpuku" -ne 0 ]; then
            exit "$RC_importResultsJraSanrenpuku"
          fi

      - name: Check for changes
        id: git-check
        if: steps.check.outputs.has_missing == 'true' || steps.check.outputs.has_missing_sanrenpuku == 'true'
        run: |
          git add src/data/archiveResultsJra.json src/data/archiveSanrenpukuResultsJra.json
          git diff --staged --exit-code || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DATE="${{ steps.date.outputs.date }}"
          COMMIT_MSG="Auto-verify: ${DATE} JRA results (daily check)"

          # 変更ファイルを退避（馬単 + 三連複）
          cp src/data/archiveResultsJra.json /tmp/archiveResultsJra.json.backup
          cp src/data/archiveSanrenpukuResultsJra.json /tmp/archiveSanrenpukuResultsJra.json.backup
          echo "📦 Backed up archiveResultsJra.json / archiveSanrenpukuResultsJra.json"

          # Retry logic: reset → restore → commit → push（最大5回リトライ）
          MAX_RETRIES=5
          RETRY_COUNT=0
          SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
            echo "🔄 Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES"

            # 1. 完全同期：origin/mainの最新状態にリセット
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            echo "✅ Synced to origin/main ($(git rev-parse --short HEAD))"

            # 2. 退避ファイルを復元（馬単 + 三連複）
            cp /tmp/archiveResultsJra.json.backup src/data/archiveResultsJra.json
            cp /tmp/archiveSanrenpukuResultsJra.json.backup src/data/archiveSanrenpukuResultsJra.json

            # 3. ステージング＆コミット
            git add src/data/archiveResultsJra.json src/data/archiveSanrenpukuResultsJra.json
            if git diff --staged --quiet; then
              echo "⏭️  No changes after sync (remote already has latest)"
              SUCCESS=true
              break
            fi
            git commit -m "$COMMIT_MSG"

            # 4. プッシュ
            if git push origin main; then
              echo "✅ Successfully pushed changes"
              SUCCESS=true
            else
              echo "⚠️  Push failed (remote updated during attempt)"
              RETRY_COUNT=$((RETRY_COUNT + 1))
              sleep 2
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ Failed to push after $MAX_RETRIES attempts"
            exit 1
          fi

      - name: Success notification
        if: steps.git-check.outputs.changed == 'true'
        run: |
          echo "✅ JRA results imported and pushed (daily check)"
          echo "   Date: ${{ steps.date.outputs.date }}"
          echo "   Trigger: scheduled (23:30 JST)"

      - name: No changes notification
        if: steps.check.outputs.has_missing != 'true' && steps.check.outputs.has_missing_sanrenpuku != 'true'
        run: |
          echo "⏭️  No missing JRA results to import"
          echo "   Date: ${{ steps.date.outputs.date }}"
          echo "   Archive is up-to-date"
