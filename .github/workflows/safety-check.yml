name: Safety Check (display index / 不要馬分類)

# 2 つの恒久ルールを CI で強制するためのワークフロー:
#   1) 表示用コンピ指数は必ず raw − 1（共通関数経由）
#      → astro-site/scripts/check-display-computer-index.mjs
#      → astro-site/scripts/check-no-raw-computer-index-display.mjs（grep ガード）
#   2) 全レースプレビューで全頭が分類済み（合計 == 出走頭数、不要馬セクション維持）
#      → astro-site/scripts/check-free-prediction-horse-sections.mjs

on:
  pull_request:
    paths:
      - 'astro-site/src/**'
      - 'astro-site/scripts/check-display-computer-index.mjs'
      - 'astro-site/scripts/check-free-prediction-horse-sections.mjs'
      - 'astro-site/scripts/check-free-mask-effective.mjs'
      - 'astro-site/scripts/check-no-raw-computer-index-display.mjs'
      - 'astro-site/scripts/check-no-ki-relics-premium-jra.mjs'
      - 'astro-site/scripts/check-no-ki-relics-free-jra-date.mjs'
      - 'astro-site/scripts/check-no-ki-relics-free-jra.mjs'
      # Functions の未定義識別子（本番 500 になる import 漏れ）を静的に検出する
      - 'astro-site/scripts/check-functions-no-undef.mjs'
      - 'astro-site/scripts/check-no-unbounded-customer-scan.mjs'
      - 'astro-site/netlify/functions/**'
      - 'astro-site/src/lib/webhooks/**'
      - 'astro-site/public/robots.txt'
      - 'astro-site/package.json'
      - 'astro-site/package-lock.json'
      - '.github/workflows/**'
      - 'astro-site/scripts/lib/workflowTransientContract.mjs'
      - 'astro-site/scripts/lib/workflowTransientContract.test.mjs'
      # 本番 Customers を削除する運用スクリプト（安全条件はテストで固定する）
      - 'astro-site/scripts/dedupe-customers.mjs'
      - 'astro-site/scripts/dedupeCustomers.test.mjs'
  push:
    branches:
      - main
    paths:
      - 'astro-site/src/**'
      - 'astro-site/scripts/check-display-computer-index.mjs'
      - 'astro-site/scripts/check-free-prediction-horse-sections.mjs'
      - 'astro-site/scripts/check-free-mask-effective.mjs'
      - 'astro-site/scripts/check-no-raw-computer-index-display.mjs'
      - 'astro-site/scripts/check-no-ki-relics-premium-jra.mjs'
      - 'astro-site/scripts/check-no-ki-relics-free-jra-date.mjs'
      - 'astro-site/scripts/check-no-ki-relics-free-jra.mjs'
      # Functions の未定義識別子（本番 500 になる import 漏れ）を静的に検出する
      - 'astro-site/scripts/check-functions-no-undef.mjs'
      - 'astro-site/scripts/check-no-unbounded-customer-scan.mjs'
      - 'astro-site/netlify/functions/**'
      - 'astro-site/src/lib/webhooks/**'
      - 'astro-site/public/robots.txt'
      - 'astro-site/package.json'
      - 'astro-site/package-lock.json'
      - '.github/workflows/**'
      - 'astro-site/scripts/lib/workflowTransientContract.mjs'
      - 'astro-site/scripts/lib/workflowTransientContract.test.mjs'
      # 本番 Customers を削除する運用スクリプト（安全条件はテストで固定する）
      - 'astro-site/scripts/dedupe-customers.mjs'
      - 'astro-site/scripts/dedupeCustomers.test.mjs'
  workflow_dispatch:

concurrency:
  group: safety-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    name: build + display-index + horse-sections + grep guard
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'astro-site/package-lock.json'

      - name: Install dependencies
        working-directory: astro-site
        run: npm ci

      # import し忘れた 1 語は build もテストも通り、**その行を通った本番でだけ 500** になる。
      # 2026-08-12 に 3 件（うち 1 件は 2 週間以上気づかれず）見つかったのでここで止める。
      - name: Verify Functions に未定義の識別子が無い（import 漏れ = 本番 500）
        working-directory: astro-site
        run: npm run check:fn-no-undef

      # Customers 15,962 件を無フィルタで先頭から読むと、人が静かに消える。
      # 既知の残件は件数まで固定してあり、1 つでも増えたら落ちる。
      - name: Verify Customers の無フィルタ全件走査を増やしていない
        working-directory: astro-site
        run: npm run check:no-unbounded-scan

      - name: Static guard - no raw {horse.computerIndex} in JSX
        working-directory: astro-site
        run: npm run check:no-raw-index

      # 一時障害（rate limit / timeout / 5xx）で schedule workflow が Failure に
      # ならないことを機械検査する。checker=exit 2 / importer=exit 75 の分類を
      # workflow 側が `exit 1` へ潰していないかを見る。
      # 2026-08-10 の KI #150 / #196 と同型の退行をここで止める。
      - name: Verify 一時障害を Failure に潰していない（schedule workflow の exit code 契約）
        working-directory: astro-site
        run: npm run test:workflow-transient

      - name: Build (astro)
        working-directory: astro-site
        env:
          # 本番と同じ validate:archive を通すため、build は最大限実運用に近付ける
          NODE_ENV: production
        run: npm run build

      - name: Verify display index == raw - 1
        working-directory: astro-site
        run: npm run check:display-index

      - name: Verify 全頭分類（不要馬セクション維持）
        working-directory: astro-site
        run: npm run check:horse-sections

      - name: Verify 無料モザイクが実際にぼける（gradient 文字で blur が無効化されていない）
        working-directory: astro-site
        run: npm run check:free-mask

      - name: Verify 差別化（keiba-intelligence と pt/役割が同一化していない）
        working-directory: astro-site
        run: npm run check:differentiation

      - name: Verify 南関近走 horseStats fallback（resolver 優先順位 + 注入配線の退行検知）
        working-directory: astro-site
        run: npm run test:nankan

      - name: Verify premium JRA 旧 KI 風混入なし
        working-directory: astro-site
        run: npm run check:ki-relics:jra

      - name: Verify free JRA [date] 旧 KI 風混入なし
        working-directory: astro-site
        run: npm run check:ki-relics:free-jra-date

      - name: Verify free JRA index 旧 KI 風混入なし
        working-directory: astro-site
        run: npm run check:ki-relics:free-jra

      - name: Verify 有料セッション ライブラリ + 会員判定/検証フロー（PR-A/PR-B / Node 20 全テスト）
        working-directory: astro-site
        run: npm run test:auth-session

      - name: Verify 認証の裏経路が無い（setTestAuth / レガシー鍵での権限昇格）
        working-directory: astro-site
        run: npm run test:auth-security

      - name: Verify SSR 実行時データの保持ポリシー
        working-directory: astro-site
        run: npm run test:ssr-retention

      - name: Verify prune 後の SSR 成果物に実行時データが残っている
        working-directory: astro-site
        run: npm run check:ssr-runtime-data

      - name: Verify 穴馬抽出の当日データ選定（過去日 fallback なし 回帰テスト）
        working-directory: astro-site
        run: npm run test:dark-horse

      - name: Verify 三連複 段階表示（初回表示日基準 4日目解禁 / 予告・結果・CTA 排他）
        working-directory: astro-site
        run: npm run test:sanrenpuku-cta

      - name: Verify 有料実績ショーケースのトップ上部プレビュー（独自集計なし / 抑え非公開 / データ無しは非表示）
        working-directory: astro-site
        run: npm run test:results-showcase

      - name: Verify SendGrid Event Webhook 署名検証 fail closed（無認証 Airtable 書込みの遮断）
        working-directory: astro-site
        run: npm run test:webhooks

      - name: Verify 決済メール送信元契約（legacy 経路含め noreply へ戻らない）
        working-directory: astro-site
        run: npm run test:bank-payment

      - name: Verify Premium Plus 管理画面の表示条件（公開条件と分離 / 表示が販売資格を与えない）
        working-directory: astro-site
        run: npm run test:premium-plus-media

      - name: Verify 顧客マーケティング（実送信なし / Customers 非書込 / 二重送信防止）
        working-directory: astro-site
        run: npm run test:marketing

      - name: Verify カムバック特典（課金フィールド非書込 / メール送信なし / 冪等付与）
        working-directory: astro-site
        run: npm run test:comeback

      - name: Verify 特典カタログ・割引オファー（価格が pricing と一致 / トークン検証 / 申込はフォーム値で請求額を決めない）
        working-directory: astro-site
        run: npm run test:promotions

      - name: Verify 販売導線（三連複と Plus を同時表示しない / 段階表示維持 / UpsellTarget 1列のみ書込）
        working-directory: astro-site
        run: npm run test:upsell

      - name: Verify 権限判定（無料特典と有料契約の分離 / Plus 販売資格不変）
        working-directory: astro-site
        run: npm run test:entitlements

      - name: Verify CRM 基盤（大規模セグメント / 計測の 0 と未計測を混同しない / ログインリンクを書き換えない）
        working-directory: astro-site
        run: npm run test:crm

      - name: Verify 重複削除スクリプトの安全条件（既定 dry-run / 権利・参照があれば消さない / 値固定の個別許可）
        working-directory: astro-site
        run: npm run test:dedupe

      - name: Verify Netlify deploy trigger（一過性 timeout は retry / 4xx は即 FAIL / 重複 build なし）
        run: bash .github/actions/netlify-deploy/tests/run-tests.sh
