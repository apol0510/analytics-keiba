name: 未来の確認を自動実行（scheduled checks）

# 「後日確認」「一定期間後に評価」を人間の記憶に依存させない（2026-09-28 MK 確定の恒久ルール）。
# 登録簿 ops/scheduled-checks.json の確認を毎日拾い、期間内で未完了のものを実行する。
#   - 成功: Issue「[自動測定] <id>」（label: scheduled-check）に結果表を記録し、artifact に JSON を残す
#   - 失敗: job を赤にし、Issue「[自動測定 失敗] <id>」に理由と必要な最小作業を書く（期限まで毎日再試行）
#   - 期限切れで未完了: 失敗 Issue に期限切れを 1 回だけ追記する
# 読むだけ（GSC は読み取り専用スコープ）。本番データ・送信には触れない。

on:
  schedule:
    # 毎日 10:00 JST（01:00 UTC）
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      today:
        description: '判定に使う日付（YYYY-MM-DD・検証用。空なら今日 JST）'
        required: false
      dry_run:
        description: '検証実行（結果は「[自動測定 検証]」で記録し、本番の完了扱いにしない）'
        type: boolean
        default: false
      simulate_failure:
        description: '失敗経路の検証（鍵を渡さずに実行する。dry_run と併用）'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'ops/scheduled-checks.json'
      - 'astro-site/scripts/scheduled-checks.mjs'
      - 'astro-site/src/lib/ops/**'
      - '.github/workflows/scheduled-checks.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: scheduled-checks
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # 失敗経路の検証（simulate_failure）では鍵を渡さない
      GSC_SERVICE_ACCOUNT_JSON: ${{ !inputs.simulate_failure && secrets.GSC_SERVICE_ACCOUNT_JSON || '' }}
      # Airtable Customers を読むだけのトークン（analytics-keiba ベース・data.records:read のみ）
      AIRTABLE_READONLY_TOKEN: ${{ !inputs.simulate_failure && secrets.AIRTABLE_READONLY_TOKEN || '' }}
      # 決済ファネルの集計値だけを読む専用の鍵（admin-payment-funnel の読み取りにしか使えない）
      PAYMENT_FUNNEL_READ_SECRET: ${{ !inputs.simulate_failure && secrets.PAYMENT_FUNNEL_READ_SECRET || '' }}
      # 検証実行は別の題名・ラベルで記録し、本番の「完了」判定（題名が「[自動測定] 」で始まる）に混ぜない
      TITLE_PREFIX: ${{ inputs.dry_run && '[自動測定 検証]' || '[自動測定]' }}
      FAIL_PREFIX: ${{ inputs.dry_run && '[自動測定 検証 失敗]' || '[自動測定 失敗]' }}
      PEND_PREFIX: ${{ inputs.dry_run && '[自動測定 検証 待機中]' || '[自動測定 待機中]' }}
      OK_LABEL: ${{ inputs.dry_run && 'scheduled-check-dryrun' || 'scheduled-check' }}
      PEND_LABEL: ${{ inputs.dry_run && 'scheduled-check-dryrun' || 'scheduled-check-pending' }}
      FAIL_LABEL: ${{ inputs.dry_run && 'scheduled-check-dryrun' || 'scheduled-check-failed' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # 依存なし（node 標準機能 + fetch）。npm install は不要
      - name: 登録簿を検査する（必須項目が欠けた登録は落とす）
        working-directory: astro-site
        run: node scripts/scheduled-checks.mjs validate

      - name: ラベルを用意する
        run: |
          gh label create scheduled-check --color 0E8A16 --description '未来の確認の自動実行結果' --force
          gh label create scheduled-check-failed --color B60205 --description '未来の確認の自動実行に失敗' --force
          gh label create scheduled-check-dryrun --color C5DEF5 --description '未来の確認の検証実行（本番の完了扱いにしない）' --force
          gh label create scheduled-check-pending --color FBCA04 --description '未来の確認: まだ起きていない・未確定（毎日再確認）' --force

      - name: 今日の扱いを決める
        id: plan
        working-directory: astro-site
        run: |
          completed=$(gh issue list --label scheduled-check --state all --limit 500 --json title \
            --jq '[.[] | select(.title | startswith("[自動測定] ")) | .title | ltrimstr("[自動測定] ")] | join(",")')
          today='${{ inputs.today }}'
          node scripts/scheduled-checks.mjs plan --completed "$completed" ${today:+--today "$today"} > /tmp/plan.json
          cat /tmp/plan.json

      - name: 期間内・未完了の確認を実行する
        id: exec
        working-directory: astro-site
        run: |
          failed=0
          mkdir -p /tmp/results
          for id in $(jq -r '.plan[] | select(.action=="run") | .id' /tmp/plan.json); do
            echo "::group::run $id"
            fail_title="$FAIL_PREFIX $id"
            pend_title="$PEND_PREFIX $id"
            find_open() { gh issue list --state open --label "$2" --search "\"$1\" in:title" --json number,title \
              --jq ".[] | select(.title==\"$1\") | .number" | head -1; }
            fail_no=$(find_open "$fail_title" "$FAIL_LABEL")
            pend_no=$(find_open "$pend_title" "$PEND_LABEL")
            set +e
            node scripts/scheduled-checks.mjs run "$id" --out "/tmp/results/$id.json" --md "/tmp/results/$id.md" --fail-md "/tmp/results/$id.fail.md"
            rc=$?
            set -e
            if [ "$rc" = 0 ]; then
              gh issue create --title "$TITLE_PREFIX $id" --label "$OK_LABEL" --body-file "/tmp/results/$id.md"
              for no in $fail_no $pend_no; do
                gh issue comment "$no" --body "✅ $(date -u +%FT%TZ) に確認できました（結果は「$TITLE_PREFIX $id」）。"
                gh issue close "$no"
              done
              cat "/tmp/results/$id.md" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$rc" = 3 ]; then
              # 待機中（まだ起きていない・未確定）: 赤にしない。待機中 Issue を 1 つだけ作る／更新する
              if [ -n "$pend_no" ]; then
                gh issue edit "$pend_no" --body-file "/tmp/results/$id.fail.md"
              else
                gh issue create --title "$pend_title" --label "$PEND_LABEL" --body-file "/tmp/results/$id.fail.md"
              fi
              cat "/tmp/results/$id.fail.md" >> "$GITHUB_STEP_SUMMARY"
            else
              failed=1
              if [ -n "$fail_no" ]; then
                gh issue edit "$fail_no" --body-file "/tmp/results/$id.fail.md"
              else
                gh issue create --title "$fail_title" --label "$FAIL_LABEL" --body-file "/tmp/results/$id.fail.md"
              fi
              cat "/tmp/results/$id.fail.md" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: 期限切れで未完了のものを知らせる（1 回だけ・必ず Issue に残す）
        run: |
          gh label create expired --color 5319E7 --force
          for id in $(jq -r '.plan[] | select(.action=="expired") | .id' /tmp/plan.json); do
            no=""
            for t in "$FAIL_PREFIX $id" "$PEND_PREFIX $id"; do
              [ -n "$no" ] && break
              no=$(gh issue list --state open --search "\"$t\" in:title" --json number,title \
                --jq ".[] | select(.title==\"$t\") | .number" | head -1)
            done
            if [ -z "$no" ]; then
              # どの Issue も無いまま期限切れ（一度も実行されなかった等）: 黙って終わらせない
              already=$(gh issue list --state all --label expired --search "\"$FAIL_PREFIX $id\" in:title" --json number --jq 'length')
              [ "$already" = 0 ] && gh issue create --title "$FAIL_PREFIX $id" --label "$FAIL_LABEL" --label expired \
                --body "⏰ 登録簿の runUntil を過ぎても成功記録がありません（一度も成功しなかった）。確認を人が引き取るか、登録簿の期間を延ばしてください。"
              continue
            fi
            has_expired=$(gh issue view "$no" --json labels --jq '[.labels[].name] | index("expired") != null')
            if [ "$has_expired" != "true" ]; then
              gh issue comment "$no" --body "⏰ 登録簿の runUntil を過ぎても成功しませんでした。確認を人が引き取るか、登録簿の期間を延ばしてください。"
              gh issue edit "$no" --add-label expired
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduled-checks-results
          path: /tmp/results
          if-no-files-found: ignore
          retention-days: 90

      - name: 失敗があれば赤にする
        if: steps.exec.outputs.failed == '1'
        run: |
          echo "::error::未来の確認の自動実行に失敗しました。Issue「[自動測定 失敗] ...」を確認してください。"
          exit 1
