name: Import Nankan Results Daily Check

on:
  schedule:
    # 毎日 23:30 JST (14:30 UTC) に実行
    - cron: '30 14 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [nankan-results-updated]

# 並行実行制御：archiveResults.json更新系workflowで統一（同じファイルへの同時コミット防止）
concurrency:
  group: archive-nankan-update
  cancel-in-progress: false

jobs:
  check-and-import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: astro-site

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'astro-site/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Get current date (JST)
        id: date
        env:
          PAYLOAD_DATE: ${{ github.event.client_payload.date }}
        run: |
          # repository_dispatchで日付が指定されている場合はそれを使用
          if [ -n "$PAYLOAD_DATE" ] && [ "$PAYLOAD_DATE" != "null" ]; then
            DATE="$PAYLOAD_DATE"
            echo "📅 Using date from repository_dispatch: $DATE"
          else
            DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
            echo "📅 Current date (JST): $DATE"
          fi
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Check for missing results
        id: check
        env:
          # private 化後の keiba-data-shared を cross-repo read するための token。
          # secrets.GITHUB_TOKEN（自repoスコープ）は private 別repo読取に使わない。
          KEIBA_DATA_SHARED_TOKEN: ${{ secrets.KEIBA_DATA_SHARED_TOKEN }}
        run: |
          # token 未設定は取得前に fail-fast（値は出力しない）
          if [ -z "${KEIBA_DATA_SHARED_TOKEN:-}" ]; then
            echo "❌ KEIBA_DATA_SHARED_TOKEN is not configured"
            exit 1
          fi

          DATE="${{ steps.date.outputs.date }}"
          YEAR="${DATE:0:4}"
          MONTH="${DATE:5:2}"
          DAY="${DATE:8:2}"

          # per-venue results(OOI/FUN/KAW/URA) の存在を「認証付き」で確認する。
          # 匿名 curl/raw は廃止。401/403/429/5xx/timeout は fatal（404 のみ未投入）。
          # 1件でも fatal なら確認 script が exit 1 → 本 step も失敗（results無しと誤判定しない）。
          #
          # exit 75 (EX_TEMPFAIL) … 一時エラー（rate limit/timeout/5xx）で確定不能＝deferred。
          #   取込は見送るが run は落とさない（次回 schedule で再判定される）。
          #   「results 無し」と誤判定して静かに素通りさせるのとは別物で、状態を明示して skip する。
          if CHECK_OUT=$(node scripts/checkSharedNankanResults.mjs --date "$DATE" --venues OOI,FUN,KAW,URA); then
            CHECK_RC=0
          else
            CHECK_RC=$?
          fi
          if [ "$CHECK_RC" -eq 75 ]; then
            echo "⏸️  一時エラーのため南関結果の有無を判定できず、取込を見送る（次回 schedule で再判定）"
            echo "has_missing=false" >> $GITHUB_OUTPUT
            echo "has_missing_sanrenpuku=false" >> $GITHUB_OUTPUT
            echo "deferred=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "$CHECK_RC" -ne 0 ]; then
            echo "❌ Failed to confirm Nankan results availability (auth/token/permission error). Not treating as 'no results'."
            exit 1
          fi
          FOUND_CODES=$(printf '%s\n' "$CHECK_OUT" | sed -n 's/^FOUND_CODES=//p')
          TOTAL_RACES=$(printf '%s\n' "$CHECK_OUT" | sed -n 's/^TOTAL_RACES=//p')
          TOTAL_RACES="${TOTAL_RACES:-0}"

          echo "🔍 per-venue検索結果: ${TOTAL_RACES}レース (codes: ${FOUND_CODES:-none})"

          # 後続ステップ（三連複取込）で再利用するため $GITHUB_ENV に保存
          echo "FOUND_CODES=${FOUND_CODES}" >> $GITHUB_ENV

          if [ "$TOTAL_RACES" -eq 0 ]; then
            echo "⏭️  No Nankan results in keiba-data-shared yet (全会場404)"
            echo "has_missing=false" >> $GITHUB_OUTPUT
            echo "has_missing_sanrenpuku=false" >> $GITHUB_OUTPUT
          elif [ "$TOTAL_RACES" -lt 12 ]; then
            echo "⏭️  Skipped: $TOTAL_RACES races (< 12)"
            echo "has_missing=false" >> $GITHUB_OUTPUT
            echo "has_missing_sanrenpuku=false" >> $GITHUB_OUTPUT
          else
            # 馬単アーカイブに既に存在するかチェック
            if grep -q "\"date\": \"$DATE\"" src/data/archiveResults.json; then
              echo "⏭️  Umatan already processed: $DATE"
              echo "has_missing=false" >> $GITHUB_OUTPUT
            else
              echo "📥 Missing umatan archive: $DATE"
              echo "has_missing=true" >> $GITHUB_OUTPUT
            fi

            # 三連複アーカイブにこの日のエントリがあるかチェック
            # archiveSanrenpukuResults.json は { "YYYY": { "MM": { "DD": {...} } } } 構造
            if jq -e --arg y "$YEAR" --arg m "$MONTH" --arg d "$DAY" \
                 '.[$y][$m][$d]' src/data/archiveSanrenpukuResults.json > /dev/null 2>&1; then
              echo "⏭️  Sanrenpuku already processed: $DATE"
              echo "has_missing_sanrenpuku=false" >> $GITHUB_OUTPUT
            else
              echo "📥 Missing sanrenpuku archive: $DATE"
              echo "has_missing_sanrenpuku=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Import missing results
        if: steps.check.outputs.has_missing == 'true'
        id: import-results
        env:
          # private 化後の keiba-data-shared を cross-repo read（importResults.js が優先使用）。
          # 認証/通信失敗は importResults.js が exit 1 → step 失敗。silent success にしない。
          KEIBA_DATA_SHARED_TOKEN: ${{ secrets.KEIBA_DATA_SHARED_TOKEN }}
        run: |
          DATE="${{ steps.date.outputs.date }}"
          echo "📥 Importing Nankan results for: $DATE"
          # exit 75 (EX_TEMPFAIL) = rate limit / timeout / 5xx で今は取得できない＝deferred。
          # archive への書込は成功時のみなので壊れた中間状態は残らない。run は failure にしない。
          # exit 1 等（auth / 権限 / schema / 検証失敗）は従来どおり失敗させる。
          if npm run import:results -- --date "$DATE"; then RC=0; else RC=$?; fi
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          if [ "$RC" -eq 75 ]; then
            echo "⏸️  importResults: 一時的に shared を取得できず未完了（deferred）。次回実行で再試行。"
            exit 0
          fi
          exit "$RC"

      - name: Validate archive format (MANDATORY)
        if: steps.check.outputs.has_missing == 'true' && steps.import-results.outputs.rc == '0'
        run: |
          echo "🔍 Validating archive format..."
          npm run validate:archive

      # 取込が deferred の run では archive は更新されていないため、ズレが残るのは想定内。
      # verify:sync 自体の exit 75（確認できない）も failure にしない。
      - name: Verify archive sync (MANDATORY)
        if: steps.check.outputs.has_missing == 'true' && steps.import-results.outputs.rc == '0'
        env:
          KEIBA_DATA_SHARED_TOKEN: ${{ secrets.KEIBA_DATA_SHARED_TOKEN }}
        run: |
          echo "🔍 Verifying archive sync with keiba-data-shared..."
          if npm run verify:sync; then RC=0; else RC=$?; fi
          if [ "$RC" -eq 75 ]; then
            echo "⏸️  verify:sync: 一時的に shared を取得できず確認不能（deferred）。次回実行で再確認。"
            exit 0
          fi
          exit "$RC"

      # 三連複（AI_SANRENPUKU_AXIS_V1）の自動取込。
      # 馬単と独立に「三連複アーカイブに当該日が無いか」を判定し、欠落していれば実行。
      # 同じ日付・会場で再実行しても scripts/importResultsSanrenpuku.js が
      # arch[y][m][d] を上書きするのみで重複登録は起きない。
      - name: Import missing sanrenpuku results
        if: steps.check.outputs.has_missing_sanrenpuku == 'true'
        id: import-sanrenpuku
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # keiba-data-shared private 化後の認証取得用（importResultsSanrenpuku.js が優先使用）。
          # fork PR 等で未供給の場合は sharedFetch が TOKEN_MISSING で明示失敗し、匿名 fallback しない。
          KEIBA_DATA_SHARED_TOKEN: ${{ secrets.KEIBA_DATA_SHARED_TOKEN }}
        run: |
          DATE="${{ steps.date.outputs.date }}"
          echo "📥 Importing sanrenpuku results for: $DATE (venues: ${FOUND_CODES})"
          # private 化後の認証障害（TOKEN_MISSING/401/403/rate/5xx/必須404）を検知するため、
          # importer の非0 exit を握りつぶさない。全会場を試行しつつ、1件でも失敗したら step を失敗させる。
          FAILED=0
          for code in $FOUND_CODES; do
            case "$code" in
              OOI) slug=ooi ;;
              FUN) slug=funabashi ;;
              KAW) slug=kawasaki ;;
              URA) slug=urawa ;;
              *)   echo "⏭️  Unknown venue code: $code"; continue ;;
            esac
            # 予想JSONが無い会場は importer 対象外（results は前段で存在確認済み）。
            if [ -f "src/data/predictions/${DATE}-${slug}.json" ]; then
              echo "▶  ${DATE} ${slug} (${code})"
              # exit 75 (EX_TEMPFAIL) = rate limit / timeout / 5xx で今は確定できない＝deferred。
              # 未書込なので途中状態は残らない。FAILED にせず次回の自動実行へ委ねる。
              if node scripts/importResultsSanrenpuku.js --date "$DATE" --venue "$slug" --venueCode "$code"; then
                RC=0
              else
                RC=$?
              fi
              if [ "$RC" -eq 75 ]; then
                echo "⏸️  sanrenpuku deferred for ${DATE} ${slug}（次回実行で再試行）"
              elif [ "$RC" -ne 0 ]; then
                echo "❌ sanrenpuku import failed for ${DATE} ${slug} (exit ${RC})"
                FAILED=1
              fi
            else
              echo "⏭️  prediction file not found: ${DATE}-${slug}.json"
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "❌ One or more sanrenpuku imports failed — failing step (no commit/push)."
            exit 1
          fi

      - name: Check for changes
        id: git-check
        if: steps.check.outputs.has_missing == 'true' || steps.check.outputs.has_missing_sanrenpuku == 'true'
        run: |
          git add src/data/archiveResults.json src/data/archiveSanrenpukuResults.json
          git diff --staged --exit-code || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DATE="${{ steps.date.outputs.date }}"
          COMMIT_MSG="Auto-verify: ${DATE} Nankan results (umatan + sanrenpuku)"

          # 変更ファイルを退避（馬単・三連複の両方）
          cp src/data/archiveResults.json /tmp/archiveResults.json.backup
          cp src/data/archiveSanrenpukuResults.json /tmp/archiveSanrenpukuResults.json.backup
          echo "📦 Backed up archiveResults.json + archiveSanrenpukuResults.json"

          # Retry logic: reset → restore → commit → push（最大5回リトライ）
          MAX_RETRIES=5
          RETRY_COUNT=0
          SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
            echo "🔄 Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES"

            # 1. 完全同期：origin/mainの最新状態にリセット
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            echo "✅ Synced to origin/main ($(git rev-parse --short HEAD))"

            # 2. 退避ファイルを復元（両方）
            cp /tmp/archiveResults.json.backup src/data/archiveResults.json
            cp /tmp/archiveSanrenpukuResults.json.backup src/data/archiveSanrenpukuResults.json

            # 3. ステージング＆コミット
            git add src/data/archiveResults.json src/data/archiveSanrenpukuResults.json
            if git diff --staged --quiet; then
              echo "⏭️  No changes after sync (remote already has latest)"
              SUCCESS=true
              break
            fi
            git commit -m "$COMMIT_MSG"

            # 4. プッシュ
            if git push origin main; then
              echo "✅ Successfully pushed changes"
              SUCCESS=true
            else
              echo "⚠️  Push failed (remote updated during attempt)"
              RETRY_COUNT=$((RETRY_COUNT + 1))
              sleep 2
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ Failed to push after $MAX_RETRIES attempts"
            exit 1
          fi

      - name: Success notification
        if: steps.git-check.outputs.changed == 'true'
        run: |
          echo "✅ Nankan results imported and pushed (daily check)"
          echo "   Date: ${{ steps.date.outputs.date }}"
          echo "   Umatan missing: ${{ steps.check.outputs.has_missing }}"
          echo "   Sanrenpuku missing: ${{ steps.check.outputs.has_missing_sanrenpuku }}"

      - name: No changes notification
        if: steps.check.outputs.has_missing != 'true' && steps.check.outputs.has_missing_sanrenpuku != 'true'
        run: |
          echo "⏭️  No missing Nankan results to import"
          echo "   Date: ${{ steps.date.outputs.date }}"
          echo "   Archives are up-to-date (umatan + sanrenpuku)"
