name: Import HorseStats Nankan (Dispatch)

# admin 側の南関 horseStats(近走詳細データ) 配信から送られる
# repository_dispatch (horse-stats-nankan-updated) を受け取り、
# keiba-data-shared/nankan/horseStats/... を本リポジトリの
# astro-site/src/data/horseStats/nankan/... へ転記する。
#
# ※ entries(entries-nankan-updated) / JRA horseHistories(horse-histories-updated) /
#    南関 recentHorseHistories(recent-horse-histories-nankan-updated) とは
#    別 event / 別 script / 別 concurrency group。既存同期には一切相乗りしない。
#    1会場=R01〜R12（最大12ファイル）。R01-only skip / 0埋め reject 等の guard は
#    importHorseStatsNankan.js に委譲する（workflow で重複実装しない）。

on:
  repository_dispatch:
    types: [horse-stats-nankan-updated]
  workflow_dispatch:
    inputs:
      date:
        description: '日付 (YYYY-MM-DD)'
        required: true
        default: ''
      venue:
        description: '場コード (OOI/KAW/FUN/URA のいずれか1つ)'
        required: true
        default: ''

# 並行実行制御：南関 horseStats 更新系の専用 group（他系統と混線させない）
concurrency:
  group: archive-horse-stats-nankan-update
  cancel-in-progress: false

jobs:
  import-horse-stats-nankan:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # git push に必要
    defaults:
      run:
        working-directory: astro-site

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'astro-site/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Resolve and validate date/venue
        id: resolve
        env:
          MANUAL_DATE: ${{ github.event.inputs.date }}
          MANUAL_VENUE: ${{ github.event.inputs.venue }}
          PAYLOAD_DATE: ${{ github.event.client_payload.date }}
          PAYLOAD_VENUE: ${{ github.event.client_payload.venue }}
        run: |
          # 優先順位: 手動入力 > repository_dispatch payload
          if [ -n "$MANUAL_DATE" ]; then
            DATE="$MANUAL_DATE"; VENUE="$MANUAL_VENUE"
          else
            DATE="$PAYLOAD_DATE"; VENUE="$PAYLOAD_VENUE"
          fi
          # 単日・単会場のみ。date 形式 / venue allowlist を厳格検証（任意入力を弾く）
          if ! echo "$DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "❌ invalid date: '$DATE'"; exit 1
          fi
          case "$VENUE" in
            OOI|KAW|FUN|URA) : ;;
            *) echo "❌ invalid venue (allowlist OOI/KAW/FUN/URA): '$VENUE'"; exit 1 ;;
          esac
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "venue=$VENUE" >> "$GITHUB_OUTPUT"
          echo "📅 horseStats(nankan) import: $DATE $VENUE"

      - name: Import horseStats (nankan) from keiba-data-shared
        id: import
        env:
          # keiba-data-shared 読み取り用 PAT（Actions の自動 GITHUB_TOKEN では届かないため）
          KEIBA_DATA_SHARED_TOKEN: ${{ secrets.KEIBA_DATA_SHARED_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # exit 75 (EX_TEMPFAIL) = レート制限 / timeout / 5xx で今は確定できない＝deferred。
          # sharedFetch が回復時刻ぶんの bounded retry を尽くした後にのみ返る。未書込なので
          # 途中状態は残らない。人間に再実行を求めず、run も failure にしない。
          # exit 1 / 2 / 4 / 5（auth・権限・schema・引数・検証失敗）は従来どおり失敗させる。
          if node scripts/importHorseStatsNankan.js \
               --date "${{ steps.resolve.outputs.date }}" \
               --venue "${{ steps.resolve.outputs.venue }}"; then
            IMPORT_RC=0
          else
            IMPORT_RC=$?
          fi

          if [ "$IMPORT_RC" -eq 75 ]; then
            echo "deferred=true" >> $GITHUB_OUTPUT
            echo "⏸️  一時的に shared を取得できないため未完了（deferred）。書込は行っていない。"
            exit 0
          elif [ "$IMPORT_RC" -ne 0 ]; then
            exit "$IMPORT_RC"
          fi
          echo "deferred=false" >> $GITHUB_OUTPUT

      - name: Check for changes (horseStats only)
        id: git-check
        if: steps.import.outputs.deferred != 'true'
        run: |
          # horseStats/nankan 配下の変更だけをステージング（他系統は触らない）
          git add src/data/horseStats/nankan/
          git diff --staged --exit-code || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Guard — only target date/venue horseStats changed
        if: steps.git-check.outputs.changed == 'true'
        env:
          DATE: ${{ steps.resolve.outputs.date }}
          VENUE: ${{ steps.resolve.outputs.venue }}
        run: |
          # ステージ済み差分が「対象日・対象会場の horseStats」以外を含まないことを保証（事故防止）
          # working-directory は astro-site だが git diff --staged --name-only は repo ルート相対
          # （astro-site/...）で出力されるため、接頭辞込みで date/venue/R01-R12 を完全一致判定する。
          YYYY="${DATE:0:4}"; MM="${DATE:5:2}"
          ALLOW="^astro-site/src/data/horseStats/nankan/${YYYY}/${MM}/${DATE}-${VENUE}-R(0[1-9]|1[0-2])\.json$"
          OFFENDERS=$(git diff --staged --name-only | grep -Ev "$ALLOW" || true)
          if [ -n "$OFFENDERS" ]; then
            echo "❌ 対象外ファイルが staged されています:"; echo "$OFFENDERS"; exit 1
          fi
          git diff --staged --check
          echo "✅ 対象 ${DATE} ${VENUE} の horseStats のみ"

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        env:
          DATE: ${{ steps.resolve.outputs.date }}
          VENUE: ${{ steps.resolve.outputs.venue }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          COMMIT_MSG="Auto-import: ${DATE} horseStats(nankan) [${VENUE}]"

          # horseStats ファイル群を退避（push 競合時の再構築用）
          mkdir -p /tmp/horse-stats-backup
          cp -r src/data/horseStats /tmp/horse-stats-backup/

          MAX_RETRIES=5; RETRY_COUNT=0; SUCCESS=false
          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
            echo "🔄 Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            mkdir -p src/data
            cp -r /tmp/horse-stats-backup/horseStats src/data/
            git add src/data/horseStats/nankan/
            if git diff --staged --quiet; then
              echo "⏭️  No changes after sync (remote already up-to-date)"; SUCCESS=true; break
            fi
            git commit -m "$COMMIT_MSG"
            if git push origin main; then
              echo "✅ pushed horseStats(nankan)"; SUCCESS=true
            else
              echo "⚠️  push failed (remote moved)"; RETRY_COUNT=$((RETRY_COUNT + 1)); sleep 2
            fi
          done
          if [ "$SUCCESS" = false ]; then echo "❌ push failed after $MAX_RETRIES attempts"; exit 1; fi

      - name: No changes notification
        if: steps.git-check.outputs.changed != 'true'
        run: echo "⏭️  No changes (horseStats already up-to-date) — no-op success"
