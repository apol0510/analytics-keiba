name: Verify Archive Sync (Daily)

on:
  schedule:
    # 毎日 0:00 JST (15:00 UTC 前日) に実行
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  verify-sync:
    runs-on: ubuntu-latest
    # private 化後の keiba-data-shared を cross-repo read するため、本 job の全 step へ供給。
    # JRA/南関の archive 突き合わせ step（checkArchiveCoverage.mjs）が認証取得に使用。
    # secrets.GITHUB_TOKEN（自repoスコープ）は private 別repo読取に使わない。
    #
    # 2026-08-09: checkSharedDailyFile.mjs（統合 daily ファイル前提）から
    # checkArchiveCoverage.mjs（shared の per-venue 構造を直接読む）へ差し替えた。
    # 旧実装は実開催日でも常に 404 →「Not found」→ アラート判定に入らず、
    # 監視が成立しないまま「✅ All dates synchronized」を出していた（偽の緑）。
    env:
      KEIBA_DATA_SHARED_TOKEN: ${{ secrets.KEIBA_DATA_SHARED_TOKEN }}

    steps:
      - name: Checkout keiba-intelligence
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JRA archive sync
        id: check-jra
        run: |
          # token 未設定は取得前に fail-fast（値は出力しない）
          if [ -z "${KEIBA_DATA_SHARED_TOKEN:-}" ]; then
            echo "❌ KEIBA_DATA_SHARED_TOKEN is not configured"
            exit 1
          fi

          # checkArchiveCoverage.mjs は shared の per-venue 構造を直接読む。
          # 旧 checkSharedDailyFile.mjs は統合 daily ファイル
          # （jra/results/YYYY/MM/YYYY-MM-DD.json）を見ていたが、shared の正本は
          # per-venue（...-CHU.json）なので常に 404 になり、実開催日でも
          # 「Not found」→ アラート判定に入らず偽の緑を出していた。
          #
          # exit 0 … 欠落なし
          # exit 2 … 一時エラー（rate limit/timeout/5xx）で未確定＝deferred。run は落とさない
          # exit 3 … 実データ欠落を検出＝Failure（アラート送信後に run を failure にする）
          # exit 1 … token / 認証 / 権限 / schema 不一致＝運用者の対応が要る fatal
          if OUT=$(node astro-site/scripts/checkArchiveCoverage.mjs --category jra --days 7); then
            RC=0
          else
            RC=$?
          fi
          echo "$OUT"

          if [ "$RC" -eq 1 ]; then
            echo "❌ JRA checkArchiveCoverage failed (token/auth/permission/schema)"
            exit 1
          fi

          MISSING=$(printf '%s\n' "$OUT" | sed -n 's/^ARCHIVE_MISSING_DATES=//p')
          NO_RESULTS=$(printf '%s\n' "$OUT" | sed -n 's/^NO_RESULTS_DATES=//p')
          DEFERRED=$(printf '%s\n' "$OUT" | sed -n 's/^DEFERRED_DATES=//p')
          UNKNOWN=$(printf '%s\n' "$OUT" | sed -n 's/^UNKNOWN_VENUE_CODES=//p')

          if [ -n "$MISSING" ]; then
            echo "alert_needed=true" >> $GITHUB_OUTPUT
            echo "missing_dates=$MISSING" >> $GITHUB_OUTPUT
            echo "🚨 JRA: archive 未反映 → $MISSING"
          else
            echo "alert_needed=false" >> $GITHUB_OUTPUT
          fi

          if [ -n "$NO_RESULTS" ]; then
            echo "no_results_alert=true" >> $GITHUB_OUTPUT
            echo "no_results_dates=$NO_RESULTS" >> $GITHUB_OUTPUT
            echo "🚨 JRA: 予想はあるが結果未登録 → $NO_RESULTS"
          else
            echo "no_results_alert=false" >> $GITHUB_OUTPUT
          fi

          if [ "$RC" -eq 3 ]; then
            echo "data_gap=true" >> $GITHUB_OUTPUT
          else
            echo "data_gap=false" >> $GITHUB_OUTPUT
          fi

          if [ -n "$DEFERRED" ]; then
            echo "⚠️  JRA: 一時エラーで未検証の日付 → ${DEFERRED}（次回実行で再検証）"
          fi
          if [ -n "$UNKNOWN" ]; then
            echo "⚠️  JRA: 未知の会場コードを検出 → $UNKNOWN"
          fi

          if [ "$RC" -eq 0 ]; then
            echo "✅ JRA: 過去7日すべて同期済み"
          fi

      - name: Check Nankan archive sync
        id: check-nankan
        run: |
          # token 未設定は取得前に fail-fast（値は出力しない）
          if [ -z "${KEIBA_DATA_SHARED_TOKEN:-}" ]; then
            echo "❌ KEIBA_DATA_SHARED_TOKEN is not configured"
            exit 1
          fi

          # checkArchiveCoverage.mjs は shared の per-venue 構造を直接読む。
          # 旧 checkSharedDailyFile.mjs は統合 daily ファイル
          # （nankan/results/YYYY/MM/YYYY-MM-DD.json）を見ていたが、shared の正本は
          # per-venue（...-CHU.json）なので常に 404 になり、実開催日でも
          # 「Not found」→ アラート判定に入らず偽の緑を出していた。
          #
          # exit 0 … 欠落なし
          # exit 2 … 一時エラー（rate limit/timeout/5xx）で未確定＝deferred。run は落とさない
          # exit 3 … 実データ欠落を検出＝Failure（アラート送信後に run を failure にする）
          # exit 1 … token / 認証 / 権限 / schema 不一致＝運用者の対応が要る fatal
          if OUT=$(node astro-site/scripts/checkArchiveCoverage.mjs --category nankan --days 7); then
            RC=0
          else
            RC=$?
          fi
          echo "$OUT"

          if [ "$RC" -eq 1 ]; then
            echo "❌ 南関 checkArchiveCoverage failed (token/auth/permission/schema)"
            exit 1
          fi

          MISSING=$(printf '%s\n' "$OUT" | sed -n 's/^ARCHIVE_MISSING_DATES=//p')
          NO_RESULTS=$(printf '%s\n' "$OUT" | sed -n 's/^NO_RESULTS_DATES=//p')
          DEFERRED=$(printf '%s\n' "$OUT" | sed -n 's/^DEFERRED_DATES=//p')
          UNKNOWN=$(printf '%s\n' "$OUT" | sed -n 's/^UNKNOWN_VENUE_CODES=//p')

          if [ -n "$MISSING" ]; then
            echo "alert_needed=true" >> $GITHUB_OUTPUT
            echo "missing_dates=$MISSING" >> $GITHUB_OUTPUT
            echo "🚨 南関: archive 未反映 → $MISSING"
          else
            echo "alert_needed=false" >> $GITHUB_OUTPUT
          fi

          if [ -n "$NO_RESULTS" ]; then
            echo "no_results_alert=true" >> $GITHUB_OUTPUT
            echo "no_results_dates=$NO_RESULTS" >> $GITHUB_OUTPUT
            echo "🚨 南関: 予想はあるが結果未登録 → $NO_RESULTS"
          else
            echo "no_results_alert=false" >> $GITHUB_OUTPUT
          fi

          if [ "$RC" -eq 3 ]; then
            echo "data_gap=true" >> $GITHUB_OUTPUT
          else
            echo "data_gap=false" >> $GITHUB_OUTPUT
          fi

          if [ -n "$DEFERRED" ]; then
            echo "⚠️  南関: 一時エラーで未検証の日付 → ${DEFERRED}（次回実行で再検証）"
          fi
          if [ -n "$UNKNOWN" ]; then
            echo "⚠️  南関: 未知の会場コードを検出 → $UNKNOWN"
          fi

          if [ "$RC" -eq 0 ]; then
            echo "✅ 南関: 過去7日すべて同期済み"
          fi

      - name: Send alert email (JRA)
        if: steps.check-jra.outputs.alert_needed == 'true'
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          EMAIL_SUBJECT: '🚨 JRA結果アーカイブ未反映検出 - keiba-intelligence'
          EMAIL_BODY: |
            マコさん、

            JRA結果データがkeiba-intelligenceのアーカイブに反映されていません。

            【未反映の日付】
            ${{ steps.check-jra.outputs.missing_dates }}

            【確認事項】
            1. keiba-data-sharedには結果データが存在します
            2. しかし、keiba-intelligenceのアーカイブに反映されていません

            【手動実行コマンド】
            cd /Users/apolon/Projects/keiba-intelligence
            gh workflow run import-results-jra.yml -f date=YYYY-MM-DD

            または、以下のURLから手動実行：
            https://github.com/apol0510/keiba-intelligence/actions/workflows/import-results-jra.yml

            【GitHub Actionsログ】
            https://github.com/apol0510/keiba-intelligence/actions

            ---
            このメールは自動送信されています。
            ワークフロー: verify-archive-sync.yml
        run: node .github/scripts/send-alert-email.js

      - name: Send alert email (JRA - No Results)
        if: steps.check-jra.outputs.no_results_alert == 'true'
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          EMAIL_SUBJECT: '🚨🚨 JRA結果データ未登録検出 - keiba-data-shared'
          EMAIL_BODY: |
            マコさん、

            JRA予想データは存在しますが、結果データがkeiba-data-sharedに登録されていません。

            【結果データが未登録の日付】
            ${{ steps.check-jra.outputs.no_results_dates }}

            【確認事項】
            1. keiba-data-sharedに予想データは存在します
            2. しかし、結果データが登録されていません

            【対応方法】
            1. 結果データをkeiba-data-sharedに登録してください
            2. 結果データのファイルパス:
               keiba-data-shared/jra/results/YYYY/MM/YYYY-MM-DD.json

            【keiba-data-sharedリポジトリ】
            https://github.com/apol0510/keiba-data-shared

            ---
            このメールは自動送信されています。
            ワークフロー: verify-archive-sync.yml
        run: node .github/scripts/send-alert-email.js

      - name: Send alert email (Nankan)
        if: steps.check-nankan.outputs.alert_needed == 'true'
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          EMAIL_SUBJECT: '🚨 南関結果アーカイブ未反映検出 - keiba-intelligence'
          EMAIL_BODY: |
            マコさん、

            南関結果データがkeiba-intelligenceのアーカイブに反映されていません。

            【未反映の日付】
            ${{ steps.check-nankan.outputs.missing_dates }}

            【確認事項】
            1. keiba-data-sharedには結果データが存在します（12レース揃い）
            2. しかし、keiba-intelligenceのアーカイブに反映されていません

            【手動実行コマンド】
            cd /Users/apolon/Projects/keiba-intelligence
            gh workflow run import-results-on-dispatch.yml -f date=YYYY-MM-DD

            または、以下のURLから手動実行：
            https://github.com/apol0510/keiba-intelligence/actions/workflows/import-results-on-dispatch.yml

            【GitHub Actionsログ】
            https://github.com/apol0510/keiba-intelligence/actions

            ---
            このメールは自動送信されています。
            ワークフロー: verify-archive-sync.yml
        run: node .github/scripts/send-alert-email.js

      - name: Send alert email (Nankan - No Results)
        if: steps.check-nankan.outputs.no_results_alert == 'true'
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          EMAIL_SUBJECT: '🚨🚨 南関結果データ未登録検出 - keiba-data-shared'
          EMAIL_BODY: |
            マコさん、

            南関予想データは存在しますが、結果データがkeiba-data-sharedに登録されていません。

            【結果データが未登録の日付】
            ${{ steps.check-nankan.outputs.no_results_dates }}

            【確認事項】
            1. keiba-data-sharedに予想データは存在します
            2. しかし、結果データが登録されていません

            【対応方法】
            1. 結果データをkeiba-data-sharedに登録してください
            2. 結果データのファイルパス:
               keiba-data-shared/nankan/results/YYYY/MM/YYYY-MM-DD.json

            【keiba-data-sharedリポジトリ】
            https://github.com/apol0510/keiba-data-shared

            ---
            このメールは自動送信されています。
            ワークフロー: verify-archive-sync.yml
        run: node .github/scripts/send-alert-email.js

      - name: Fail on unresolved archive gaps
        # 実データ欠落は「偽の緑」を出さないため run を failure にする。
        # アラートメール送信ステップの後に置くので、通知は必ず先に飛ぶ。
        # 一時エラー（deferred）ではここに来ない＝ノイズで赤くならない。
        if: steps.check-jra.outputs.data_gap == 'true' || steps.check-nankan.outputs.data_gap == 'true'
        run: |
          echo "❌ archive 欠落を検出（アラートメールは送信済み）"
          echo "   JRA  missing=${{ steps.check-jra.outputs.missing_dates }} no-results=${{ steps.check-jra.outputs.no_results_dates }}"
          echo "   南関 missing=${{ steps.check-nankan.outputs.missing_dates }} no-results=${{ steps.check-nankan.outputs.no_results_dates }}"
          exit 1

      - name: Success notification
        if: steps.check-jra.outputs.data_gap != 'true' && steps.check-nankan.outputs.data_gap != 'true'
        run: |
          echo "✅ 過去7日の archive 監視に欠落なし"
          echo "   JRA:  data_gap=${{ steps.check-jra.outputs.data_gap }}"
          echo "   南関: data_gap=${{ steps.check-nankan.outputs.data_gap }}"
          echo "   （一時エラーで未検証の日があった場合は各ステップのログに ⚠️ で出ている）"
