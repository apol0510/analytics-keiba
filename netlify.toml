[build]
  base = "astro-site"
  publish = "dist"
  command = "npm run build"


[build.environment]
  # ⚠️ astro-site/netlify.toml の NODE_VERSION と**必ず同じ値**にすること（2026-08-21 に統一）。
  NODE_VERSION = "22"

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "max-age=31536000, immutable"

# Cache CSS and JS
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "max-age=31536000, immutable"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 【2026-08-31】SSR ページの CDN キャッシュ（Function 実行回数の削減）
#
# このサイトは `output: 'server'` なので、静的化されていないページは
# **1 アクセス = 1 Function 実行**になる。実測ではどの SSR ページも
# `cache-control: no-cache` / `age: 0` で、再訪もクローラも毎回関数を起動していた。
#
# ⚠️ **`Netlify-CDN-Cache-Control` だけを付ける。** これは Netlify の CDN にだけ効き、
#    ブラウザ向けの `Cache-Control` は変えない。**利用者から見た鮮度は従来どおり**で、
#    エッジで再利用される分だけ関数呼び出しが減る。
# ⚠️ **`/*` には掛けない。** Cookie で内容が変わるページ（会員向け予想・auth・admin）を
#    エッジに載せると**他人の内容を配信し得る**。下の対象は
#    `Astro.cookies` / `gatePaidPage` / `verifyPlanAccess` / `SessionKeepAlive` を
#    **どれも使っていない公開ページだけ**に限っており、
#    `scripts/check-cdn-cache-safety.mjs` が CI でその条件を検査する。
# ⚠️ `s-maxage=300`（5分）と短くしてある。データ更新は deploy を伴うので、
#    deploy 時にエッジは自動で無効化される。`stale-while-revalidate` は
#    「古いものを返しつつ裏で更新」であり、**最大 5 分より古い内容は出さない**。

# 公開アーカイブ（月別・年別。過去データなので変化しない）
[[headers]]
  for = "/archive/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, s-maxage=300, stale-while-revalidate=86400"

# 無料公開ページ（会員判定を持たない）
[[headers]]
  for = "/free/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, s-maxage=300, stale-while-revalidate=86400"

[[headers]]
  for = "/free-prediction/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, s-maxage=300, stale-while-revalidate=86400"

# 実績ショーケース（公開・個人化なし）
[[headers]]
  for = "/results-showcase/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, s-maxage=300, stale-while-revalidate=86400"

# 日別結果（公開・過去データ）
[[headers]]
  for = "/results/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, s-maxage=300, stale-while-revalidate=86400"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 予想ページ URL 再編（南関/中央を対称構造へ）
# 旧URLは 301 で新URLへ恒久移動
# 重要:
#   - 新URL (/free-prediction/nankan 等) には必ず静的ファイルが存在する
#   - 新URLを巻き込まないよう、from は exact 一致のみ使用
#   - JRA 旧URLは sub-route ([date]/archive) もあるので splat を後ろに追加
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# --- 無料予想 (中央) : sub-route も一緒に移行 ---
# splat で /free-prediction-jra/archive や /free-prediction-jra/2026-04-12 も拾う
[[redirects]]
  from = "/free-prediction-jra/*"
  to = "/free-prediction/jra/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/free-prediction-jra"
  to = "/free-prediction/jra/"
  status = 301
  force = true

# --- プレミアム予想 (南関) ---
# trailingSlash:'always' で正規形は末尾スラッシュ有。no-slash は Netlify 正規化で slash へ寄るため、
# slash 形にも force 301 を置き、正規形 URL から新URLへサーバ301を発火させる（旧stubページをフォールバックに残す）。
[[redirects]]
  from = "/premium-predictions"
  to = "/premium-prediction/nankan/"
  status = 301
  force = true

[[redirects]]
  from = "/premium-predictions/"
  to = "/premium-prediction/nankan/"
  status = 301
  force = true

# --- プレミアム予想 (中央) ---
[[redirects]]
  from = "/premium-predictions-jra"
  to = "/premium-prediction/jra/"
  status = 301
  force = true

[[redirects]]
  from = "/premium-predictions-jra/"
  to = "/premium-prediction/jra/"
  status = 301
  force = true

# --- 旧SSR JRA prediction (廃止) ---
[[redirects]]
  from = "/prediction-jra"
  to = "/premium-prediction/jra/"
  status = 301
  force = true

[[redirects]]
  from = "/prediction-jra/"
  to = "/premium-prediction/jra/"
  status = 301
  force = true

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# アーカイブ URL 再編（中央/南関を /archive 配下の階層構造へ統一）
# 旧: /archive-jra/*  /archive/[YEAR]/*
# 新: /archive/jra/*  /archive/nankan/[YEAR]/*
# 重要: 新URL（/archive/jra, /archive/nankan）には先にしてマッチしないよう
#   year を明示した from で範囲を絞る
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# --- 中央: /archive-jra/* → /archive/jra/:splat ---
[[redirects]]
  from = "/archive-jra/*"
  to = "/archive/jra/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/archive-jra"
  to = "/archive/jra/"
  status = 301
  force = true

# --- 南関: /archive/{year}/* → /archive/nankan/{year}/:splat ---
[[redirects]]
  from = "/archive/2024/*"
  to = "/archive/nankan/2024/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/archive/2025/*"
  to = "/archive/nankan/2025/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/archive/2026/*"
  to = "/archive/nankan/2026/:splat"
  status = 301
  force = true