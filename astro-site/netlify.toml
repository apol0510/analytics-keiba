[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"
  # Force cache clear
  NETLIFY_CACHE_VERSION = "v9"
  # EMERGENCY CACHE CLEAR - FORCE REBUILD
  BUILD_TIMESTAMP = "2026-01-12-22:22-ARCHIVE-2026-COMPLETE"
  # CRITICAL CACHE BUSTING - COMPLETE INVALIDATION
  BET_DISPLAY_VERSION = "v8-ARCHIVE-2026-BOTH-YEARS"
  # FORCE COMPLETE REBUILD
  FORCE_REBUILD = "ARCHIVE-DATA-2025-2026-BOTH"
  # CLEAR ALL CACHES
  CACHE_CLEAR = "TOTAL-REBUILD-20260112-2222"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.css"  
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[redirects]]
  from = "/tokutei"
  to = "/legal"
  status = 301

[[redirects]]
  from = "/tokutei/"
  to = "/legal/"
  status = 301

[[redirects]]
  from = "/old-premium"
  to = "/premium-predictions"
  status = 301

[[redirects]]
  from = "/old-standard"
  to = "/standard-predictions"
  status = 301

# Stripe Webhook - 必ずNetlify Functionに転送（最優先）
[[redirects]]
  from = "/api/stripe/webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

# API Routes - Server function handling
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/ssr"
  status = 200

# Admin panel protection
[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200
  headers = {X-Frame-Options = "DENY"}

[[edge_functions]]
  function = "admin-auth"
  path = "/admin/*"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ── メルマガ自動化 scheduler（Scheduled Function）─────────────────
# ⚠️ schedule を登録することで **Netlify の scheduled function** になり、
#    公開 URL からの HTTP 起動は Netlify 側で **404** になる（外部から叩けない）。
#    これが「外部から起動させない」ことの一次的な保証。専用 secret は廃止した。
# ⚠️ cron 式は **UTC**。JST = UTC+9 なので `0 1 * * *` = **毎日 JST 10:00**。
#    自動化の quiet hours は 21:00-08:00 JST なので、その外側の午前中に置く。
# ⚠️ 実際に処理へ進むには、さらに env のゲートが要る（登録しただけでは副作用 0）:
#      MARKETING_AUTOMATION_SCHEDULER_ENABLED=true
#      MARKETING_AUTOMATION_DISPATCH_ARMED=<当日の JST 日付>
#      MARKETING_CAMPAIGN_ENABLED / MARKETING_CAMPAIGN_DISPATCH_ENABLED
#    いずれも production 未設定のため、現状は起動しても何もしない。
[functions."cron-marketing-automation"]
  schedule = "0 1 * * *"
  # 注: SSR 関数肥大化（250MB 超）対策は netlify.toml の included_files では効かない
  # （@astrojs/netlify は nodeBundler:'none' + includedFiles:['**/*'] で関数ディレクトリを
  # そのまま zip するため、config の除外が反映されない）。代わりに build スクリプト末尾の
  # scripts/prune-ssr-function-data.mjs で、ビルド後の SSR 関数から重い src/data 群を削除している。

[dev]
  command = "npm run dev"
  port = 4321
  publish = "dist"
  autoLaunch = false
