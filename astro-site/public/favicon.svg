  <circle cx="50" cy="12" r="6" fill="#10b981"/>
  <!-- ロボットの頭 -->
  <rect x="19" y="26" width="62" height="53" rx="15" fill="#ffffff"/>
  <!-- 目 -->
  <circle cx="38" cy="49" r="8.5" fill="#3b82f6"/>
  <circle cx="62" cy="49" r="8.5" fill="#3b82f6"/>
